<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="minor" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <pattern id="major" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100 0H0V100" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.2"/>
    </pattern>
  </defs>

  <rect width="900" height="300" rx="16" fill="#0b3c6e"/>
  <rect width="900" height="300" rx="16" fill="url(#minor)"/>
  <rect width="900" height="300" rx="16" fill="url(#major)"/>
  <rect x="10" y="10" width="880" height="280" rx="10" fill="none" stroke="#cfe8ff" stroke-opacity="0.6" stroke-width="1.5"/>

  <!-- text -->
  <text x="40" y="52" font-family="Courier New, monospace" font-size="13" fill="#7dd3fc" letter-spacing="5">BLUEPRINT · AMES HOUSING · SHEET 01</text>
  <text x="40" y="104" font-family="Courier New, monospace" font-size="36" font-weight="bold" fill="#ffffff">House Price Prediction</text>
  <text x="40" y="138" font-family="Courier New, monospace" font-size="20" fill="#cfe8ff">Using Machine Learning</text>

  <text x="40" y="196" font-family="Courier New, monospace" font-size="14" fill="#7dd3fc">SalePrice = f( Quality, Area, Basement,</text>
  <text x="40" y="218" font-family="Courier New, monospace" font-size="14" fill="#7dd3fc">               Garage, YearBuilt )</text>
  <text x="40" y="262" font-family="Courier New, monospace" font-size="11" fill="#cfe8ff" fill-opacity="0.7">SCALE: log1p(SalePrice)   ·   MODELS: 5   ·   DRAWN BY: M. MAKWANA</text>

  <!-- house being drawn -->
  <g fill="none" stroke="#e8f4ff" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
    <polygon pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" points="590,170 710,100 830,170">
      <animate attributeName="stroke-dashoffset" values="1;0;0;1" keyTimes="0;0.35;0.9;1" dur="7s" repeatCount="indefinite"/>
    </polygon>
    <rect pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" x="600" y="170" width="220" height="80">
      <animate attributeName="stroke-dashoffset" values="1;1;0;0;1" keyTimes="0;0.15;0.5;0.9;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" x="695" y="205" width="30" height="45">
      <animate attributeName="stroke-dashoffset" values="1;1;0;0;1" keyTimes="0;0.4;0.6;0.9;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" x="620" y="190" width="40" height="30">
      <animate attributeName="stroke-dashoffset" values="1;1;0;0;1" keyTimes="0;0.45;0.65;0.9;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" x="760" y="190" width="40" height="30">
      <animate attributeName="stroke-dashoffset" values="1;1;0;0;1" keyTimes="0;0.5;0.7;0.9;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <line x1="570" y1="250" x2="850" y2="250" stroke-width="3"/>
  </g>

  <!-- dimension lines -->
  <g stroke="#7dd3fc" stroke-width="1.5" fill="none" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.55;0.65;0.9;1" dur="7s" repeatCount="indefinite"/>
    <!-- horizontal -->
    <line x1="600" y1="266" x2="820" y2="266"/>
    <line x1="600" y1="260" x2="600" y2="272"/>
    <line x1="820" y1="260" x2="820" y2="272"/>
    <!-- vertical -->
    <line x1="862" y1="100" x2="862" y2="250"/>
    <line x1="854" y1="100" x2="870" y2="100"/>
    <line x1="854" y1="250" x2="870" y2="250"/>
    <text x="710" y="284" text-anchor="middle" stroke="none" fill="#7dd3fc" font-family="Courier New, monospace" font-size="12">GrLivArea</text>
    <text x="0" y="0" transform="translate(882 175) rotate(-90)" text-anchor="middle" stroke="none" fill="#7dd3fc" font-family="Courier New, monospace" font-size="12">OverallQual</text>
  </g>
</svg>
